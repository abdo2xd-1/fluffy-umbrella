name: Auto Generate and Publish Luma AI Shorts

on:
  schedule:
    # يعمل تلقائياً يومياً الساعة 6:00 مساءً بتوقيت مصر (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch: # للتشغيل اليدوي والتجربة فوراً

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Auto Generation & Publish Script
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
        run: |
          python publish.py
